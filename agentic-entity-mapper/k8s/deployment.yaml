apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-text-pipeline
  namespace: medical-pipeline
  labels:
    app: medical-text-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-text-pipeline
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: medical-text-pipeline
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      containers:
        - name: medical-text-pipeline
          # Replace with your actual image registry
          image: your-registry/medical-text-pipeline:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: medical-pipeline-config
          
          # Environment from Secret
          env:
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: medical-pipeline-secrets
                  key: LLM_BASE_URL
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: medical-pipeline-secrets
                  key: LLM_MODEL
          
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          
          volumeMounts:
            - name: output-volume
              mountPath: /app/output
      
      volumes:
        - name: output-volume
          emptyDir: {}
      
      # Optional: Add image pull secrets if using private registry
      # imagePullSecrets:
      #   - name: regcred
