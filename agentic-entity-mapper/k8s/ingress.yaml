apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medical-text-pipeline
  namespace: medical-pipeline
  labels:
    app: medical-text-pipeline
  annotations:
    # Adjust these annotations based on your ingress controller
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: medical-pipeline.example.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medical-text-pipeline
                port:
                  number: 8000
  # Optional: Enable TLS
  # tls:
  #   - hosts:
  #       - medical-pipeline.example.com
  #     secretName: medical-pipeline-tls
