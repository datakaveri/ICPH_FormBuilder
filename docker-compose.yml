services:
  icph:
    build:
      context: .
      args:
        VITE_FORM_BUILDER_API: "${VITE_FORM_BUILDER_API:-}"
    image: "${ICPH_IMAGE:-ghcr.io/datakaveri/icph-form-builder:latest}"
    init: true
    user: "${ICPH_UID:-1000}:${ICPH_GID:-1000}"
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8787:8787"
    environment:
      NODE_ENV: production
      ICPH_FORM_BUILDER_API_PORT: "8787"
      DATABASE_URL: "postgres://${POSTGRES_USER:-icph}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-icph}"
      KEYCLOAK_URL: http://keycloak:8080                                   # token keys, inside compose network
      KEYCLOAK_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}" # browser-visible URL (login + token issuer)
      KEYCLOAK_REALM: icph
      KEYCLOAK_CLIENT_ID: icph-form-builder
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ./agentic-entity-mapper/SchemaTerminologies
        target: /app/agentic-entity-mapper/SchemaTerminologies
    tmpfs:
      # Scratch space for the XLSForm, terminology and FHIR tools, which work on files.
      - /tmp:rw,noexec,nosuid,size=512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:5173/'), fetch('http://127.0.0.1:8787/api/health')]).then(([web, api]) => process.exit(web.ok && api.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped

  # Form builder database. The app creates and migrates its schema on start.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-icph}"
      POSTGRES_USER: "${POSTGRES_USER:-icph}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Local development identity provider. start-dev is not a production setup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-password}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/themes/icph:/opt/keycloak/themes/icph:ro
    restart: unless-stopped

  # One-shot init: creates the icph realm, roles, client and users. Safe to re-run.
  keycloak-setup:
    image: python:3.12-alpine
    depends_on:
      - keycloak
    volumes:
      - ./keycloak:/setup:ro
    environment:
      KC_URL: http://keycloak:8080
      KC_PUBLIC_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}"
      KC_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KC_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-password}"
      APP_URLS: "${ICPH_APP_URLS:-http://localhost:5173}"
    command: python /setup/setup.py

volumes:
  keycloak-data:
  postgres-data:
