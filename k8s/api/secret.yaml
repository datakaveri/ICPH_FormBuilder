# Secrets for the ICPH Form Builder backend API.
# Referenced by icph-form-builder-api.yaml (env DATABASE_URL -> secretKeyRef).
#
# Do not commit this file with real values. Either keep the placeholder here
# and create the Secret on the cluster directly:
#   kubectl -n icph create secret generic icph-form-builder-api \
#     --from-literal=DATABASE_URL='postgres://USER:PASSWORD@HOST:5432/icph?sslmode=disable'
# or fill it in locally and apply it without checking it in.
apiVersion: v1
kind: Secret
metadata:
  name: icph-form-builder-api
  namespace: icph                                   # CHANGE: namespace (same as the Deployment)
  labels:
    app: icph-form-builder-api
type: Opaque
stringData:
  # CHANGE: user, password, host and database.
  DATABASE_URL: "postgres://USER:PASSWORD@psql-postgresql-ha-pgpool.postgres.svc.cluster.local:5432/icph?sslmode=disable"
