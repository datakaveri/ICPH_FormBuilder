parent=keycloak
import=common/keycloak
styles=css/login.css css/custom.css

kcFormCardClass=card-pf
kcInputClass=custom-pf-c-form-control
kcButtonClass=custom-pf-c-button
# classes defining priority of the button - primary or default (there is typically only one priority button for the form)
kcButtonPrimaryClass=custom-pf-m-primary
kcLabelClass=custom-pf-c-form__label custom-pf-c-form__label-text
kcFormGroupClass=custom-form-group
kcFormHeaderClass=custom-header
kcFormOptionsWrapperClass=custom-forgot-password
kcInputErrorMessageClass=custom-input-error

# Where the header logo links to when the login was not started from the app.
navBasePath=http://localhost:5173
